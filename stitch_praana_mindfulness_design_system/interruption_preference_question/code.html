<script>
        function toggleSelect(element) {
            element.classList.toggle('selected');
            // Subtle haptic feedback feel
            element.style.transform = 'scale(0.97)';
            setTimeout(() => {
                element.style.transform = 'scale(1)';
            }, 100);
        }

        function completeProfile() {
            // Check if at least one is selected
            const selected = document.querySelectorAll('.conscious-card.selected');
            if (selected.length === 0) {
                alert("Please select at least one way Praana can support you.");
                return;
            }
            
            const btn = event.currentTarget;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Finalizing...';
            btn.classList.add('opacity-80');
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check</span> All set';
                btn.classList.remove('bg-primary');
                btn.classList.add('bg-tertiary-container', 'text-on-tertiary-container');
                
                // Final celebration animation
                const main = document.querySelector('main');
                main.style.transition = 'all 1s ease';
                main.style.opacity = '0';
                main.style.transform = 'translateY(-20px)';
                
                setTimeout(() => {
                    alert("Welcome to Praana. Your journey begins.");
                }, 800);
            }, 1500);
        }
    </script>
