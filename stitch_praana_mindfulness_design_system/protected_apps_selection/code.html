<script>
        const protectedApps = new Set();

        function toggleApp(element, appName) {
            const toggle = element.querySelector('.custom-toggle');
            const dot = element.querySelector('.dot');
            const isSelected = toggle.classList.toggle('active');
            
            element.classList.toggle('selected');
            
            if (isSelected) {
                dot.classList.add('translate-x-6');
                protectedApps.add(appName);
            } else {
                dot.classList.remove('translate-x-6');
                protectedApps.delete(appName);
            }

            updateChips();
            
            // Haptic-like interaction
            element.style.transform = 'scale(0.99)';
            setTimeout(() => {
                element.style.transform = 'scale(1)';
            }, 150);
        }

        function updateChips() {
            const container = document.getElementById('protected-chips');
            container.innerHTML = '';

            if (protectedApps.size === 0) {
                container.innerHTML = '<span class="empty-state text-on-surface-variant font-body-md italic">Creating a canopy of silence... No apps selected yet.</span>';
                return;
            }

            protectedApps.forEach(app => {
                const chip = document.createElement('div');
                chip.className = 'bg-primary-container/10 text-primary px-4 py-1.5 rounded-full text-label-md font-medium flex items-center gap-2 border border-primary/10 animate-in fade-in slide-in-from-bottom-1 duration-500';
                chip.innerHTML = `
                    <span class="material-symbols-outlined text-[16px]" data-icon="shield">shield</span>
                    ${app}
                `;
                container.appendChild(chip);
            });
        }
    </script>
