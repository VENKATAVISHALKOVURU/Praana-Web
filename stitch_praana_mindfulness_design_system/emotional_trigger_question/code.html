<!-- Progress Bar -->

<div class="h-full bg-primary conscious-friction" style="width: 20%"></div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center max-w-2xl mx-auto w-full px-margin-mobile py-xl">
<!-- Decorative Reflection Graphic -->
<div class="mb-xl fade-in-up" style="animation-delay: 0.1s;">
<div class="relative w-24 h-24 rounded-full bg-surface-herbal/30 flex items-center justify-center">
<div class="w-16 h-16 rounded-full bg-surface-herbal/60 animate-pulse"></div>

</div>
</div>
<!-- Question Header -->
<section class="text-center mb-xl fade-in-up" style="animation-delay: 0.2s;">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-sm">
                What usually brings you back to your phone?
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-md mx-auto">
                Understanding your triggers is the first step toward conscious presence.
            </p>
</section>
<!-- Selection Grid (Bento-lite pill layout) -->
<div class="w-full grid grid-cols-1 gap-sm fade-in-up" id="options-container" style="animation-delay: 0.3s;">
<button class="group flex items-center justify-between p-lg rounded-xl border border-border-dusty bg-surface-mint hover:bg-surface-container-low conscious-friction text-left outline-none" onclick="toggleSelect(this)">
<span class="font-title-lg text-title-lg text-secondary group-hover:text-primary transition-colors">Stress</span>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-opacity opacity-0 group-[.selected]:opacity-100" data-weight="fill">check_circle</span>
</button>
<button class="group flex items-center justify-between p-lg rounded-xl border border-border-dusty bg-surface-mint hover:bg-surface-container-low conscious-friction text-left outline-none" onclick="toggleSelect(this)">

<span class="material-symbols-outlined text-outline group-hover:text-primary transition-opacity opacity-0 group-[.selected]:opacity-100" data-weight="fill">check_circle</span>
</button>

<script>
        function toggleSelect(element) {
            // Check if selected
            const isSelected = element.classList.contains('selected');
            
            // For a "one thing at a time" philosophy, we could restrict to single choice,
            // but usually triggers are multiple. Let's allow multiple but animate clearly.
            if (isSelected) {
                element.classList.remove('selected', 'bg-surface-herbal', 'border-primary');
                element.classList.add('bg-surface-mint', 'border-border-dusty');
            } else {
                element.classList.add('selected', 'bg-surface-herbal', 'border-primary');
                element.classList.remove('bg-surface-mint', 'border-border-dusty');
                
                // Micro-interaction sound or vibration would go here
                if (window.navigator.vibrate) {
                    window.navigator.vibrate(5);
                }
            }

            // Update continue button state
            const selectedCount = document.querySelectorAll('.selected').length;
            const btn = document.getElementById('continue-btn');
            if (selectedCount > 0) {
                btn.disabled = false;
            } else {
                btn.disabled = true;
            }
        }

        // Initialize button state
        document.getElementById('continue-btn').disabled = true;
    </script>
