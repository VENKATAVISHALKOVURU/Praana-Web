<script>
        // Simple Timer Logic
        let timeLeft = 1498; // 24:58 in seconds
        const timerElement = document.getElementById('timer');
        const statusElement = document.getElementById('status-text');
        
        const statusMessages = [
            "Your attention is settling.",
            "Stay with what matters.",
            "The breath is your anchor.",
            "Gentle awareness only.",
            "Presence over performance."
        ];

        let messageIndex = 0;

        function updateTimer() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerElement.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            if (timeLeft > 0) {
                timeLeft--;
            } else {
                timerElement.textContent = "Done";
                statusElement.textContent = "Session Complete";
            }
        }

        // Cycle through status messages slowly
        function rotateStatus() {
            statusElement.style.opacity = 0;
            setTimeout(() => {
                messageIndex = (messageIndex + 1) % statusMessages.length;
                statusElement.textContent = statusMessages[messageIndex];
                statusElement.style.opacity = 1;
            }, 1000);
        }

        setInterval(updateTimer, 1000);
        setInterval(rotateStatus, 15000);

        // Interaction subtle effect
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) / 100;
            const moveY = (e.clientY - window.innerHeight / 2) / 100;
            timerElement.style.transform = `translate(${moveX}px, ${moveY}px)`;
        });
    </script>
