<body class="min-h-screen flex flex-col items-center justify-center font-body-md text-body-md overflow-x-hidden">
<!-- Premium Background Ornamentation -->
<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute -top-24 -right-24 w-96 h-96 bg-surface-mint rounded-full blur-[100px] opacity-60"></div>
<div class="absolute -bottom-24 -left-24 w-96 h-96 bg-surface-herbal rounded-full blur-[100px] opacity-30"></div>
</div>
<!-- Main Container: Linear Signup Flow Suppression of Global Shell -->
<main class="relative z-10 w-full max-w-[420px] px-margin-mobile py-xl flex flex-col items-center">
<!-- Brand Identity / Logo -->
<div class="mb-xl flex flex-col items-center space-y-sm">
<span class="material-symbols-outlined text-primary text-[48px] opacity-90" data-icon="bubble_chart">bubble_chart</span>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">Praana</h1>
</div>
<!-- Hero Visual Section -->
<div class="w-full mb-xl rounded-xl overflow-hidden soft-shadow bg-surface-mint aspect-video relative">
<img alt="Conscious Beginnings" class="w-full h-full object-cover mix-blend-multiply opacity-80" data-alt="A tranquil and ethereal digital artwork showing a soft green organic landscape with gentle atmospheric fog and a single glowing light source. The color palette features Mint Cream and Herbal Green, evoking a sense of calm and intentional deceleration within a minimalist, premium wellness application interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB8jxe9kfi8aLf9DCJVGBxGCL2xSXWvKZy7JZDYJJ9DQjqZ4PgzJQ7UaRH1HBElJXOPDIrX7ZdCz31knLJzmRNfyNbBEah3HN4lWwV756qKfgO2jEjoyz5-TxpLzNyP8M_Yj8fzF2bh4bNPx7sUCG23PaJd2WAcTjkYKu4DR05IUdn-YtGcIB-DOJEhOKphRZJoRlwp8ufqmbDbuwdCoEYwyH2rS59oYYdRj71iwglYuC5TNp4jgoUpIGXEhjVstpfXZmDvBkh3KgA">
<div class="absolute inset-0 bg-gradient-to-t from-surface-mint/80 to-transparent"></div>
</div>
<!-- Welcome Text -->
<div class="text-center mb-lg space-y-xs">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Begin your journey</h2>
<p class="font-body-md text-on-surface-variant italic">This space adapts gently to you.</p>
</div>
<!-- Signup Form -->
<form class="w-full space-y-md" id="signupForm">
<!-- Full Name Field -->
<div class="flex flex-col space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-sm" for="name">Full Name</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-border-dusty border rounded-xl px-md py-sm font-body-md text-on-surface placeholder:text-outline input-focus-state transition-all duration-300" id="name" placeholder="Elias Thorne" required="" type="text">
</div>
</div>
<!-- Email Field -->
<div class="flex flex-col space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-sm" for="email">Email Address</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-border-dusty border rounded-xl px-md py-sm font-body-md text-on-surface placeholder:text-outline input-focus-state transition-all duration-300" id="email" placeholder="hello@praana.co" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-sm" for="password">Create Password</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-border-dusty border rounded-xl px-md py-sm font-body-md text-on-surface placeholder:text-outline input-focus-state transition-all duration-300" id="password" placeholder="••••••••" required="" type="password">
<button class="absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant opacity-60 hover:opacity-100 transition-opacity" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Primary Action -->
<div class="pt-sm">
<button class="w-full bg-primary text-on-primary font-title-lg text-title-lg py-md rounded-xl soft-shadow active:scale-[0.98] transition-transform duration-200 hover:bg-primary-container hover:text-on-primary-container" type="submit">
                    Continue
                </button>
</div><div class="pt-md"><button class="w-full flex items-center justify-center space-x-2 bg-transparent border border-border-dusty text-on-surface font-label-md text-label-md py-md rounded-xl hover:bg-surface-container-low transition-colors duration-200 active:scale-[0.98]" type="button"><svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path></svg><span class="">Continue with Google</span></button></div>

<footer class="mt-xl text-center space-y-md">
<p class="font-label-md text-label-md text-on-surface-variant">
                Already have an account? <a class="text-primary font-bold hover:underline" href="#">Log in</a>
</p>
<div class="flex items-center justify-center space-x-sm pt-md">
<span class="h-[1px] w-8 bg-border-dusty"></span>
<span class="font-label-sm text-label-sm text-outline tracking-widest uppercase">Editorial Precision</span>
<span class="h-[1px] w-8 bg-border-dusty"></span>
</div>
</footer>
</main>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('signupForm');
            const inputs = form.querySelectorAll('input');

            // Atmospheric focus effects
            inputs.forEach(input => {
                input.addEventListener('focus', () => {
                    input.parentElement.closest('div').style.transform = 'translateY(-2px)';
                    input.parentElement.closest('div').style.transition = 'transform 0.3s ease';
                });
                input.addEventListener('blur', () => {
                    input.parentElement.closest('div').style.transform = 'translateY(0)';
                });
            });

            // Smooth submission simulation
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const btn = e.target.querySelector('button[type="submit"]');
                btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span>';
                btn.disabled = true;
                
                setTimeout(() => {
                    btn.innerHTML = 'Welcome home';
                    btn.classList.replace('bg-primary', 'bg-tertiary-container');
                    btn.classList.replace('text-on-primary', 'text-on-tertiary-container');
                }, 1500);
            });
        });
    </script>
