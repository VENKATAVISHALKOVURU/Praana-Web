<script>
    // Simple Timer Logic
    let minutes = 24;
    let seconds = 58;
    let isPaused = false;
    const timerDisplay = document.getElementById('main-timer');
    const pauseBtn = document.getElementById('play-pause');
    const pauseIcon = document.getElementById('pause-icon');
    const statusText = pauseBtn.querySelector('span:last-child');

    function updateTimer() {
      if (isPaused) return;
      
      if (seconds === 0) {
        if (minutes === 0) {
          clearInterval(timerInterval);
          return;
        }
        minutes--;
        seconds = 59;
      } else {
        seconds--;
      }

      const m = minutes < 10 ? '0' + minutes : minutes;
      const s = seconds < 10 ? '0' + seconds : seconds;
      timerDisplay.innerText = `${m}:${s}`;
      
      // Update SVG Ring
      const totalSeconds = 25 * 60;
      const currentSeconds = (minutes * 60) + seconds;
      const offset = (currentSeconds / totalSeconds) * 283;
      document.querySelector('.timer-ring').style.strokeDashoffset = 283 - offset;
    }

    const timerInterval = setInterval(updateTimer, 1000);

    pauseBtn.addEventListener('click', () => {
      isPaused = !isPaused;
      if (isPaused) {
        pauseIcon.innerText = 'play_arrow';
        statusText.innerText = 'Paused';
        statusText.classList.remove('text-primary');
        statusText.classList.add('text-on-surface-variant');
      } else {
        pauseIcon.innerText = 'pause';
        statusText.innerText = 'Focusing';
        statusText.classList.add('text-primary');
        statusText.classList.remove('text-on-surface-variant');
      }
    });

    // Handle Leave Icon interaction
    document.querySelector('header button').addEventListener('click', () => {
      if(confirm("Ready to step away from the shared silence?")) {
        window.history.back();
      }
    });
  </script>
