<style>
        .material-symbols-outlined {
            font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
        }
        @keyframes fullBreathingCycle {
            0% { transform: scale(1); filter: blur(40px); opacity: 0.6; }
            40% { transform: scale(1.4); filter: blur(20px); opacity: 0.8; } /* Inhale 4s */
            60% { transform: scale(1.42); filter: blur(15px); opacity: 0.9; } /* Hold 2s */
            100% { transform: scale(1); filter: blur(40px); opacity: 0.6; } /* Exhale 4s */
        }
        @keyframes orbGlow {
            0%, 100% { box-shadow: 0 0 60px 10px rgba(195, 229, 178, 0.3); }

        }
        .breathing-orb {
            animation: fullBreathingCycle 10s ease-in-out infinite, orbGlow 10s ease-in-out infinite;

            mix-blend-mode: soft-light;

<script>
        const breathingText = document.getElementById('breathing-text');
        
        // Sequence timing: 0-4s Inhale, 4-6s Hold, 6-10s Exhale
        function updateSequence() {
            // 1. Inhale slowly (Starts at 0s)
            breathingText.style.opacity = '0';
            setTimeout(() => {
                breathingText.innerText = "Inhale slowly";
                breathingText.style.opacity = '1';
            }, 100);

            // 2. Hold (Transition at 3.5s to be ready for 4s start)
            setTimeout(() => {
                breathingText.style.opacity = '0';
                setTimeout(() => {
                    breathingText.innerText = "Hold";
                    breathingText.style.opacity = '0.8';
                }, 400);
            }, 3400);

            // 3. Exhale gently (Transition at 5.5s to be ready for 6s start)
            setTimeout(() => {
                breathingText.style.opacity = '0';
                setTimeout(() => {
                    breathingText.innerText = "Exhale gently";
                    breathingText.style.opacity = '1';
                }, 400);
            }, 5400);

            // 4. Fade out for transition back to inhale (9.2s)
            setTimeout(() => {
                breathingText.style.opacity = '0';
            }, 9200);
        }

        // Initialize and loop
        updateSequence();
        const textLoop = setInterval(updateSequence, 10000);

        // Interaction
        document.querySelector('button').addEventListener('click', () => {
            document.body.style.transition = 'opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1)';
            document.body.style.opacity = '0';
            setTimeout(() => {
                // Navigation logic placeholder
                window.location.reload(); 
            }, 1200);
        });
    </script>
