<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Praana - Create Space</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Sora:wght@500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-error-container": "#93000a",
                    "surface-herbal": "#C3E5B2",
                    "on-background": "#1b1c15",
                    "on-surface": "#1b1c15",
                    "surface-container-low": "#f5f4e8",
                    "on-tertiary-container": "#84b680",
                    "outline-variant": "#c2c8c0",
                    "secondary-fixed": "#e6e7a1",
                    "inverse-primary": "#aad0af",
                    "surface-tint": "#44664c",
                    "surface-variant": "#e4e3d7",
                    "border-dusty": "#A0AC9D",
                    "on-tertiary": "#ffffff",
                    "outline": "#727971",
                    "on-secondary-fixed-variant": "#484914",
                    "on-secondary-container": "#66672f",
                    "surface-dim": "#dcdacf",
                    "tertiary": "#003009",
                    "secondary": "#606129",
                    "inverse-surface": "#303129",
                    "on-secondary-fixed": "#1c1d00",
                    "tertiary-fixed": "#bcf0b6",
                    "on-error": "#ffffff",
                    "on-secondary": "#ffffff",
                    "background": "#fbfaed",
                    "on-surface-variant": "#424842",
                    "shadow-olive": "#5A5B2C",
                    "tertiary-fixed-dim": "#a1d39b",
                    "secondary-fixed-dim": "#caca87",
                    "primary-container": "#24452d",
                    "primary": "#0d2e19",
                    "surface-container-high": "#eae9dc",
                    "surface-bright": "#fbfaed",
                    "on-primary": "#ffffff",
                    "secondary-container": "#e6e7a1",
                    "surface-container-highest": "#e4e3d7",
                    "surface": "#fbfaed",
                    "tertiary-container": "#1a471d",
                    "surface-container-lowest": "#ffffff",
                    "surface-container": "#f0eee2",
                    "primary-fixed": "#c6ecca",
                    "primary-fixed-dim": "#aad0af",
                    "surface-mint": "#E7F6E6",
                    "error": "#ba1a1a",
                    "on-tertiary-fixed-variant": "#235025",
                    "on-primary-fixed-variant": "#2d4e35",
                    "on-primary-fixed": "#00210d",
                    "on-tertiary-fixed": "#002205",
                    "on-primary-container": "#8db293",
                    "error-container": "#ffdad6",
                    "inverse-on-surface": "#f3f1e5"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "xs": "4px",
                    "unit": "4px",
                    "margin-desktop": "40px",
                    "gutter": "16px",
                    "margin-mobile": "20px",
                    "md": "16px",
                    "lg": "24px",
                    "sm": "8px",
                    "xl": "32px"
            },
            "fontFamily": {
                    "label-sm": ["Inter"],
                    "display-lg": ["Sora"],
                    "label-md": ["Inter"],
                    "body-lg": ["Inter"],
                    "headline-lg": ["Sora"],
                    "body-md": ["Inter"],
                    "headline-md": ["Sora"],
                    "headline-lg-mobile": ["Sora"],
                    "title-lg": ["Inter"]
            },
            "fontSize": {
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "display-lg": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "500"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "500"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "500"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "500"}],
                    "title-lg": ["20px", {"lineHeight": "28px", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #fbfaed;
            color: #1b1c15;
            -webkit-font-smoothing: antialiased;
        }
        .option-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .option-card:hover {
            background-color: #f0eee2;
        }
        .option-card.selected {
            background-color: #e6e7a1;
            border-color: #606129;
            transform: translateY(-2px);
        }
        .progress-bar-fill {
            transition: width 0.8s cubic-bezier(0.65, 0, 0.35, 1);
        }
        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen selection:bg-surface-herbal/30">
<!-- Top Navigation (Onboarding Focus) -->
<header class="w-full flex justify-between items-center px-margin-mobile py-sm md:px-margin-desktop md:py-md">
<button aria-label="Go back" class="p-2 hover:bg-surface-container-low rounded-full transition-colors">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">Step 4 of 5</span>
<div class="flex gap-1 mt-2">
<div class="w-8 h-1 rounded-full bg-primary/20"></div>
<div class="w-8 h-1 rounded-full bg-primary/20"></div>
<div class="w-8 h-1 rounded-full bg-primary/20"></div>
<div class="w-8 h-1 rounded-full bg-primary overflow-hidden relative">
<div class="absolute inset-0 bg-primary progress-bar-fill" style="width: 80%;"></div>
</div>
<div class="w-8 h-1 rounded-full bg-primary/10"></div>
</div>
</div>
<button class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors">
            Skip
        </button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop py-xl max-w-4xl mx-auto w-full">
<!-- Animated Background Element (Subtle Glassmorphism) -->
<div class="absolute top-1/4 left-1/2 -translate-x-1/2 -z-10 w-[300px] h-[300px] bg-surface-herbal/20 blur-[80px] rounded-full opacity-60"></div>
<section class="w-full text-center mb-xl fade-in">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-md tracking-tight leading-tight">
                What do you want more <br class="hidden md:block"/> space for in your life?
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-md mx-auto">
                We’ll tailor your experience to help you cultivate the intentionality you need.
            </p>
</section>
<!-- Options Bento-like Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-md w-full fade-in" style="animation-delay: 0.1s;">
<!-- Option: Better focus -->
<button class="option-card group flex flex-col p-lg bg-surface-mint border border-border-dusty/30 rounded-xl text-left hover:border-primary/40" onclick="selectOption(this)">
<div class="mb-lg w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm group-hover:bg-primary-fixed transition-colors">
<span class="material-symbols-outlined text-primary">center_focus_strong</span>
</div>
<span class="font-title-lg text-title-lg text-primary mb-xs">Better focus</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Minimize noise and find your flow state.</span>
</button>
<!-- Option: Better sleep -->
<button class="option-card group flex flex-col p-lg bg-surface-mint border border-border-dusty/30 rounded-xl text-left hover:border-primary/40" onclick="selectOption(this)">
<div class="mb-lg w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm group-hover:bg-primary-fixed transition-colors">
<span class="material-symbols-outlined text-primary">dark_mode</span>
</div>
<span class="font-title-lg text-title-lg text-primary mb-xs">Better sleep</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Unwind deeply and restore your natural rhythm.</span>
</button>
<!-- Option: Calmness -->
<button class="option-card group flex flex-col p-lg bg-surface-mint border border-border-dusty/30 rounded-xl text-left hover:border-primary/40 lg:col-span-1" onclick="selectOption(this)">
<div class="mb-lg w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm group-hover:bg-primary-fixed transition-colors">
<span class="material-symbols-outlined text-primary">filter_vintage</span>
</div>
<span class="font-title-lg text-title-lg text-primary mb-xs">Calmness</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Quiet the internal chatter and breathe easier.</span>
</button>
<!-- Option: Creativity -->
<button class="option-card group flex flex-col p-lg bg-surface-mint border border-border-dusty/30 rounded-xl text-left hover:border-primary/40" onclick="selectOption(this)">
<div class="mb-lg w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm group-hover:bg-primary-fixed transition-colors">
<span class="material-symbols-outlined text-primary">brush</span>
</div>
<span class="font-title-lg text-title-lg text-primary mb-xs">Creativity</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Open mental portals for new ideas to emerge.</span>
</button>
<!-- Option: Discipline -->
<button class="option-card group flex flex-col p-lg bg-surface-mint border border-border-dusty/30 rounded-xl text-left hover:border-primary/40" onclick="selectOption(this)">
<div class="mb-lg w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm group-hover:bg-primary-fixed transition-colors">
<span class="material-symbols-outlined text-primary">shield_moon</span>
</div>
<span class="font-title-lg text-title-lg text-primary mb-xs">Discipline</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Build sustainable rituals with gentle rigor.</span>
</button>
<!-- AI Insight Card (Saathi) -->
<div class="flex flex-col p-lg bg-surface-herbal/20 border border-surface-herbal rounded-xl md:col-span-2 lg:col-span-1">
<div class="flex items-center gap-2 mb-sm">
<span class="material-symbols-outlined text-primary scale-75">auto_awesome</span>
<span class="font-label-sm text-label-sm text-primary uppercase tracking-tighter">Saathi Perspective</span>
</div>
<p class="font-label-md text-label-md text-on-secondary-container italic">
                    "Finding space isn't about clearing your calendar, but clearing your mind."
                </p>
</div>
</div>
</main>
<!-- Bottom Action Area -->
<footer class="sticky bottom-0 w-full bg-background/80 backdrop-blur-md px-margin-mobile py-lg md:px-margin-desktop flex flex-col items-center">
<button class="w-full max-w-sm py-4 bg-primary text-on-primary font-title-lg text-title-lg rounded-full shadow-olive/15 shadow-lg active:scale-95 transition-all opacity-50 cursor-not-allowed" disabled="" id="continue-btn">
            Continue
        </button>
<p class="mt-md font-label-sm text-label-sm text-on-surface-variant">You can change these goals later in settings.</p>
</footer>
<script>
        let selectedOptions = new Set();

        function selectOption(element) {
            const btn = document.getElementById('continue-btn');
            
            if (element.classList.contains('selected')) {
                element.classList.remove('selected');
                selectedOptions.delete(element);
            } else {
                element.classList.add('selected');
                selectedOptions.add(element);
            }

            if (selectedOptions.size > 0) {
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                btn.classList.add('hover:bg-primary-container', 'hover:shadow-xl');
            } else {
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
                btn.classList.remove('hover:bg-primary-container', 'hover:shadow-xl');
            }
        }
    </script>
</body></html>
