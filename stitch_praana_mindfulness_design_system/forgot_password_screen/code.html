<style>
    body {
      background-color: #fbfaed;
      color: #1b1c15;
      font-family: 'Inter', sans-serif;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .conscious-glow {
      background: radial-gradient(circle at center, #E7F6E6 0%, transparent 70%);
      opacity: 0.6;
    }
    .soft-shadow {
      box-shadow: 0 10px 40px -10px rgba(90, 91, 44, 0.1);

      min-height: max(884px, 100dvh);

<body class="min-h-screen flex flex-col items-center justify-center p-margin-mobile overflow-hidden">
<!-- Background Atmospheric Layer -->
<div class="fixed inset-0 -z-10 flex items-center justify-center pointer-events-none">
<div class="conscious-glow w-[600px] h-[600px] blur-3xl animate-pulse"></div>
</div>
<!-- Header - Styled from TopAppBar Identity -->
<header class="fixed top-0 w-full px-margin-mobile py-sm flex justify-center items-center z-50">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-size: 24px;">bubble_chart</span>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">Praana</h1>
</div>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-[400px] flex flex-col items-center text-center">
<!-- Emotional Anchor Image -->
<div class="mb-xl w-32 h-32 rounded-full overflow-hidden border-2 border-surface-container-high soft-shadow relative bg-surface-mint">
<img alt="Calm botanical background" class="w-full h-full object-cover opacity-80" data-alt="A serene close-up photograph of a single translucent leaf with delicate veins, bathed in soft morning sunlight. The color palette is composed of gentle herbal greens and warm creams, creating an atmosphere of quiet growth and peace. The lighting is diffused and airy, reflecting a high-end wellness aesthetic and a sense of emotional clarity and breathing room." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBdHwy_5fyaCXHEKucA8PEZiPdscQPspSvDUxOBjN72xaXqgpfAH5vC8MadzsjJI2roNwR5dsacIzz7MMGVmexjbeEh3WzmWP1sn6H1BB0VozwXAgUgbD-P4PQJfr9Wb7GeBNgNW-ZKTaDep0eMPpYRIg9MSCiZfv3g00wSP51UKMA64T2XPWdR14BZlayXnFcg08cP5cTwfOu8DJc7ehPoCm2AnnEOtjt65YusFvEaVtG1oDKaQKpEAzhYpZbG64nddAWh5sDUFZY"/>
</div>
<!-- Typography Content -->
<div class="space-y-sm mb-xl">
<p class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight px-4">
        Sometimes we all need a reset.
      </p>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[300px] mx-auto">
        If you’ve forgotten your path back, enter your email and we’ll help you find it.
      </p>
</div>
<!-- Interaction Module -->
<div class="w-full bg-surface-mint/30 p-lg rounded-xl border border-outline-variant/30 soft-shadow backdrop-blur-sm">
<form class="flex flex-col gap-md">
<div class="flex flex-col gap-xs text-left">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1" for="email">EMAIL ADDRESS</label>
<input class="w-full px-md py-sm bg-surface-container-lowest border border-border-dusty rounded-lg font-body-md text-body-md focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-outline-variant" id="email" placeholder="name@example.com" type="email"/>
</div>
<button class="w-full bg-primary text-surface-mint py-md rounded-lg font-title-lg text-title-lg hover:bg-primary/90 active:scale-[0.98] transition-all soft-shadow" type="button">
          Reset password
        </button>
</form>
</div>
<!-- Back to Login Navigation -->
<div class="mt-xl">
<a class="group flex items-center gap-xs font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined text-[18px] group-hover:-translate-x-1 transition-transform">arrow_back</span>
        Back to login
      </a>
</div>
</main>
<!-- Footer Subtle Branding -->
<footer class="fixed bottom-lg w-full flex justify-center pointer-events-none opacity-40">
<p class="font-label-sm text-label-sm uppercase tracking-widest text-on-surface-variant">Inner peace through intentionality</p>
</footer>
<!-- Micro-interaction Script -->
<script>
    // Subtle mouse parallax effect for the background glow
    document.addEventListener('mousemove', (e) => {
      const glow = document.querySelector('.conscious-glow');
      const x = (e.clientX / window.innerWidth - 0.5) * 40;
      const y = (e.clientY / window.innerHeight - 0.5) * 40;
      glow.style.transform = `translate(${x}px, ${y}px)`;
    });

    // Form button feedback
    const btn = document.querySelector('button');
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      btn.textContent = 'Sending link...';
      btn.style.opacity = '0.8';
      setTimeout(() => {
        btn.textContent = 'Link sent';
        btn.classList.replace('bg-primary', 'bg-tertiary-container');
        btn.classList.replace('text-surface-mint', 'text-on-tertiary-container');
      }, 1500);
    });
  </script>
