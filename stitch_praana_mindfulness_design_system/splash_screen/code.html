<style>@keyframes breathe {
    0%, 100% {
        transform: scale(1);
        opacity: 0.9;
        filter: blur(0px);
        } 50% {
        transform: scale(1.08);
        opacity: 1;
        filter: blur(1px);
        }
    }
@keyframes organic-drift {
    0% {
        transform: translate(0, 0) scale(1);
        } 33% {
        transform: translate(2%, 4%) scale(1.1);
        } 66% {
        transform: translate(-3%, 2%) scale(0.95);
        } 100% {
        transform: translate(0, 0) scale(1);
        }
    }
.animate-breathe {
    animation: breathe 6s ease-in-out infinite
    }
.animate-drift {
    animation: organic-drift 20s ease-in-out infinite alternate
    }
.grain-texture {
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuCTpr6fu0neGCOEu64UClpqeE-GFTFcm8kwrS5j6gsDvUc_LdiGQYPaJLKz0OjwZCK9xpH3FNaODresh4YB3EdCGr0Es0zq72MfIdh87TX0R5iY5oHO59UEvkGscnZ4oKSCJWKr88WEpngUZBwnNtw_4fcxtHdx6QhqKsWJvgzA6uSGxP7u6UcMCIeoVXbvkFM_yQT7_qlDgi763PBJCi9Zrxzrs8s-SGhkm_fbIkI-DL0HgDZM5wLT17Gs1UHvJjF56jSVHt3dPmw);
    opacity: 0.15;
    pointer-events: none
    }</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface text-on-surface font-body-md overflow-hidden h-screen w-screen flex flex-col justify-between items-center relative">
<!-- Ambient Organic Background Layers -->
<div class="absolute inset-0 z-0 pointer-events-none overflow-hidden">
<!-- Layer 1: Soft Herbal Green Base -->
<div class="absolute -top-1/4 -left-1/4 w-[150%] h-[150%] bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-surface-herbal/30 via-surface/0 to-surface/0 animate-drift"></div>
<!-- Layer 2: Mint Cream Mist -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[120%] h-[120%] bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-surface-mint/40 via-surface/0 to-surface/0 opacity-60" style="animation: organic-drift 25s ease-in-out infinite reverse;"></div>
<!-- Layer 3: Subtle Sage Accents -->
<div class="absolute -bottom-1/4 -right-1/4 w-full h-full bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-outline-variant/10 via-surface/0 to-surface/0"></div>
<!-- Texture Overlay -->
<div class="absolute inset-0 grain-texture z-10"></div>
</div>
<!-- Top Spacer for Vertical Rhythm -->
<div class="h-margin-mobile md:h-margin-desktop w-full"></div>
<!-- Center Logo & Branding -->
<main class="relative z-20 flex flex-col items-center justify-center flex-grow">
<!-- Logo Pulse Visual -->
<div class="relative flex items-center justify-center">
<!-- Pulsing Aura -->
<div class="absolute w-32 h-32 md:w-48 md:h-48 bg-surface-herbal/20 rounded-full animate-breathe blur-xl"></div>
<div class="absolute w-24 h-24 md:w-36 md:h-36 border border-surface-herbal/30 rounded-full animate-breathe" style="animation-delay: 1s;"></div>
<!-- Branding Container -->
<div class="relative flex flex-col items-center">
<span class="material-symbols-outlined text-primary text-[64px] md:text-[80px] mb-md animate-breathe" data-icon="bubble_chart" style="font-variation-settings: 'wght' 200;">bubble_chart</span>
<h1 class="font-headline-md text-headline-md md:font-headline-lg md:text-headline-lg text-primary tracking-tight">Praana</h1>
</div>
</div>
</main>
<!-- Bottom Editorial Affirmation -->
<footer class="relative z-20 pb-xl md:pb-margin-desktop px-margin-mobile w-full flex flex-col items-center text-center">
<!-- Progress Indicator (Minimalist) -->
<div class="w-16 h-[2px] bg-outline-variant/20 mb-lg overflow-hidden relative">
<div class="absolute h-full bg-primary/40 w-1/3 animate-[shimmer_3s_infinite_ease-in-out]"></div>
</div>
<p class="font-label-md text-label-md text-on-surface-variant/70 tracking-widest uppercase">
            Awareness before impulse.
        </p>
</footer>
<!-- CSS Animation for the subtle progress bar shimmer -->
<style>
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(100%); }
            100% { transform: translateX(200%); }
        }
    </style>
<!-- Micro-interaction JavaScript -->
<script>
        // Smooth entrance for the bottom text
        document.addEventListener('DOMContentLoaded', () => {
            const footerText = document.querySelector('footer p');
            footerText.style.opacity = '0';
            footerText.style.transform = 'translateY(10px)';
            
            setTimeout(() => {
                footerText.style.transition = 'all 2s cubic-bezier(0.2, 0, 0.4, 1)';
                footerText.style.opacity = '1';
                footerText.style.transform = 'translateY(0)';
            }, 1000);
        });

        // Subtle Mouse parallax for the background drift
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 2;
            const y = (e.clientY / window.innerHeight) * 2;
            const logo = document.querySelector('main');
            if (logo) {
                logo.style.transform = `translate(${x}px, ${y}px)`;
                logo.style.transition = 'transform 0.5s ease-out';
            }
        });
    </script>
</body></html>
