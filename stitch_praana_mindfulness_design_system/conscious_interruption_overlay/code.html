<!-- Interactive Breath Guide Logic -->
<script>
    // Subtle interactivity to enhance the calm vibe
    const orb = document.querySelector('.animate-pulse-orb');
    let breathPhase = 'Inhale';
    
    // Simple state indicator hidden in console or small toast could be added,
    // but the philosophy is "Quiet", so we let the animation speak.
    
    document.addEventListener('DOMContentLoaded', () => {
      // Logic for button transitions
      const primaryBtn = document.querySelector('button.bg-primary');
      const secondaryBtn = document.querySelector('button.border-border-dusty');
      
      primaryBtn.addEventListener('click', () => {
        // Visual feedback for 'returning'
        document.body.style.opacity = '0';
        document.body.style.transition = 'opacity 0.8s ease-in-out';
        setTimeout(() => {
          alert("Focus maintained. Keep breathing.");
          document.body.style.opacity = '1';
        }, 800);
      });

      secondaryBtn.addEventListener('click', () => {
        // Warning or confirmation for intentional interruption
        const confirmEnd = confirm("Ending a session is a conscious choice. Are you sure you're ready to re-engage?");
        if(confirmEnd) {
          document.body.style.filter = 'grayscale(100%)';
          setTimeout(() => {
            alert("Session Ended. Navigate with intention.");
            document.body.style.filter = 'none';
          }, 500);
        }
      });
    });
  </script>
