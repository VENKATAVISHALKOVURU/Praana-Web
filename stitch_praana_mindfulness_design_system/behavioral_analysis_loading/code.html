<style>
        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.6; filter: blur(20px); }
            50% { transform: scale(1.15); opacity: 0.9; filter: blur(40px); }
        }
        .orb-pulse {
            animation: breathe 8s ease-in-out infinite;
        }
        .canvas-gradient {
            background: radial-gradient(circle at 50% 50%, #E7F6E6 0%, #fbfaed 100%);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .stagger-in {
            opacity: 0;
            transform: translateY(10px);
            animation: fadeIn 1.2s forwards;
        }
        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }
        .delay-1 { animation-delay: 0.4s; }
        .delay-2 { animation-delay: 0.8s; }
    </style>

    body {

<body class="bg-background text-on-surface selection:bg-surface-herbal overflow-hidden">
<!-- The Navigation is suppressed to prioritize the psychological safety of the loading canvas -->
<main class="relative min-h-screen w-full flex items-center justify-center canvas-gradient overflow-hidden">
<!-- Ambient Decorative Elements -->
<div class="absolute inset-0 pointer-events-none">
<div class="absolute top-[-10%] right-[-10%] w-[600px] h-[600px] rounded-full bg-surface-herbal opacity-20 blur-[100px]"></div>
<div class="absolute bottom-[-15%] left-[-10%] w-[500px] h-[500px] rounded-full bg-secondary-container opacity-15 blur-[120px]"></div>
</div>
<div class="relative z-10 w-full max-w-md px-margin-mobile flex flex-col items-center text-center">
<!-- Central Breathing Orb -->
<div class="relative mb-xl">
<!-- Inner Solid Layer -->
<div class="w-32 h-32 rounded-full bg-surface-herbal shadow-lg shadow-shadow-olive/10 flex items-center justify-center relative z-20">
<span class="material-symbols-outlined text-primary text-4xl" data-icon="bubble_chart">bubble_chart</span>
</div>
<!-- Outer Pulsing Glows -->
<div class="absolute inset-[-20px] bg-primary-fixed opacity-40 rounded-full orb-pulse z-10"></div>
<div class="absolute inset-[-40px] bg-surface-herbal opacity-20 rounded-full orb-pulse z-0" style="animation-delay: -2s;"></div>
</div>
<!-- Primary Status Text -->
<h1 class="font-headline-md text-headline-md text-primary mb-sm stagger-in">
                Understanding your attention patterns...
            </h1>
<!-- Descriptive Subtext -->
<p class="font-body-md text-body-md text-on-surface-variant stagger-in delay-1 max-w-[280px] leading-relaxed">
                This helps Praana create calmer and more intentional experiences.
            </p>
<!-- Progress Insight Card -->
<div class="mt-xl w-full bg-surface-mint/80 backdrop-blur-md rounded-xl p-lg border border-border-dusty/30 shadow-sm stagger-in delay-2">
<div class="flex items-center justify-between mb-sm">
<span class="font-label-sm text-label-sm text-primary uppercase tracking-widest">Cognitive Load Check</span>
<span class="font-label-md text-label-md text-secondary" id="loading-percent">0%</span>
</div>
<div class="h-1 w-full bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-primary transition-all duration-700 ease-out" id="loading-bar" style="width: 0%"></div>
</div>
<div class="mt-md flex gap-sm items-start">
<span class="material-symbols-outlined text-secondary text-[20px]" data-icon="auto_awesome">auto_awesome</span>
<p class="font-label-md text-label-md text-on-surface-variant text-left italic">
                        "Patience is the calm acceptance that things can happen in a different order than the one you have in mind."
                    </p>
</div>
</div>
<!-- Bottom Brand Identifier -->
<div class="mt-xl pt-xl flex flex-col items-center gap-xs opacity-60">

</div>
<script>
        // Micro-interaction for the loading bar
        let progress = 0;
        const bar = document.getElementById('loading-bar');
        const text = document.getElementById('loading-percent');

        const simulateProgress = () => {
            if (progress < 100) {
                // Slower at the end to create "intentional friction"
                const increment = progress > 80 ? Math.random() * 0.5 : Math.random() * 2;
                progress += increment;
                if (progress > 100) progress = 100;
                
                bar.style.width = `${progress}%`;
                text.innerText = `${Math.floor(progress)}%`;
                
                requestAnimationFrame(() => {
                    setTimeout(simulateProgress, 50);
                });
            }
        };

        // Start animation after a brief initial pause for "conscious entry"
        setTimeout(simulateProgress, 1200);

        // Gentle cursor interaction for the orb
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 15;
            const y = (e.clientY / window.innerHeight - 0.5) * 15;
            const orbContainer = document.querySelector('.relative.mb-xl');
            if (orbContainer) {
                orbContainer.style.transform = `translate(${x}px, ${y}px)`;
                orbContainer.style.transition = 'transform 0.4s ease-out';
            }
        });
    </script>
