<style>
        body {
            background-color: #fbfaed;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        .conscious-layer {
            background: radial-gradient(circle at 50% 50%, rgba(251, 250, 237, 0.92) 0%, rgba(185, 237, 179, 0.4) 100%);

            box-shadow: 0 20px 40px -10px rgba(90, 91, 44, 0.08);
            max-width: 420px;

            transform: translateY(2px);
        }
        .mock-app-bg {
            filter: blur(12px) grayscale(40%);

        }

<body class="h-screen w-full flex flex-col items-center justify-center relative bg-surface">
<!-- Background Layer: Simulated "Distracting App" -->
<div class="absolute inset-0 z-0 overflow-hidden mock-app-bg">
<div class="grid grid-cols-3 gap-1 p-1">
<div class="aspect-square bg-surface-container-highest"></div>
<div class="aspect-square bg-surface-container-high"></div>
<div class="aspect-square bg-surface-container"></div>
<div class="aspect-square bg-surface-container-highest"></div>

<div class="aspect-square bg-surface-container"></div>

<div class="aspect-square bg-surface-container-high"></div>
<div class="aspect-square bg-surface-container"></div>
<div class="aspect-square bg-surface-container-highest"></div>
<div class="aspect-square bg-surface-container-high"></div>
<div class="aspect-square bg-surface-container"></div>
</div>
<div class="absolute bottom-10 left-1/2 -translate-x-1/2 w-4/5 h-12 bg-surface-container-highest rounded-full opacity-50"></div>
</div>
<!-- Conscious Overlay Layer -->
<div class="absolute inset-0 z-10 conscious-layer"></div>
<!-- Main Content Canvas -->
<main class="relative z-20 w-full h-full max-w-lg flex flex-col px-margin-mobile md:px-margin-desktop py-12">
<!-- Top Section -->
<header class="flex flex-col items-center text-center space-y-2 mb-8">
<h1 class="font-display-lg text-primary tracking-tight">Reflect</h1>
<p class="font-body-md text-on-surface-variant opacity-80">Pause before impulse.</p>
</header>
<!-- Main Story Card Cluster -->
<section class="flex-grow flex items-center justify-center">
<div class="story-card bg-surface rounded-[16px] overflow-hidden flex flex-col w-full">
<!-- Serene Image -->
<div class="aspect-[4/5] relative w-full overflow-hidden">
<img alt="Serene natural landscape with misty forest at sunrise" class="w-full h-full object-cover transition-transform duration-700 hover:scale-105" src="https://lh3.googleusercontent.com/aida/ADBb0ugxxhQJUsEuWeDgwyovnoVQ_5eUltv7c-dXti7sqHA5xyHjfiTHUG0QzsEXA6aTzaXcExm4VaNOdyqzxwltkYElc9RtoITMy4LI9p5R90Y4rLhgpfr95MMdAFpKBZnfdthSvv3Mq99eaNFjWS8eTyZWTol7DRx20B7QpqoVxTjfnjbfedvVickAxP8wg2d9vGAhaQuQgmfM-6eR8uZygCD4JMTzAYy49FW5iWEl-WyRJSoIwXO-avN1E9I"/>
<div class="absolute inset-0 bg-gradient-to-t from-surface/40 to-transparent"></div>
</div>
<!-- Narrative Content -->
<div class="p-lg md:p-xl space-y-md">
<p class="font-body-lg text-on-surface leading-relaxed text-center md:text-left">
                        "A student once realized that late-night scrolling wasn't helping them rest — it was only delaying what their mind actually needed: <span class="text-primary font-semibold">quiet</span>."
                    </p>
</div>
</div>
</section>
<!-- Action Section -->
<footer class="mt-8 flex flex-col items-center space-y-lg">
<div class="w-full space-y-md">
<button class="btn-press w-full py-md bg-primary-container text-surface-mint font-label-md rounded-[8px] transition-all duration-200 hover:bg-primary shadow-sm">
                    Exit App
                </button>
<button class="w-full py-md border border-border-dusty text-on-surface-variant font-label-md rounded-[8px] transition-colors hover:bg-surface-mint/50">
                    Continue Anyway
                </button>
</div>
<!-- Saathi AI Link -->
<div class="flex items-center gap-2 text-on-surface-variant/80 hover:text-primary transition-colors cursor-pointer group">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 0;">psychology</span>
<span class="font-label-sm border-b border-transparent group-hover:border-primary">Talk to Saathi</span>
</div>
</footer>
</main>
<!-- Navigation Shell (Suppressed due to transactional/focused nature of the screen) -->
<!-- BottomNavBar and TopAppBar are excluded as per "Shell Visibility & Relevance" mandate for focused journeys -->
<script>
        // Micro-interactions for the story card emergence
        document.addEventListener('DOMContentLoaded', () => {
            const card = document.querySelector('.story-card');
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                card.style.transition = 'all 0.8s cubic-bezier(0.22, 1, 0.36, 1)';
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, 300);
        });

        // Interactive states for buttons
        const exitBtn = document.querySelector('button:first-of-type');
        exitBtn.addEventListener('click', () => {
            document.body.style.transition = 'opacity 0.5s ease-out';
            document.body.style.opacity = '0';
            setTimeout(() => {
                alert('Closing application environment...');
            }, 500);
        });
    </script>
