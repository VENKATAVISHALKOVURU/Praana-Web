<style>
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .conscious-blur {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

        .soft-elevation {
            box-shadow: 0 10px 40px -10px rgba(90, 91, 44, 0.1);
        }
        .input-focus-transition {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes subtle-breath {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.02); opacity: 1; }
        }
        .animate-breath {
            animation: subtle-breath 8s ease-in-out infinite;
        }
    </style>

<style>

<body class="bg-background text-on-surface min-h-screen flex flex-col items-center justify-center selection:bg-surface-herbal overflow-hidden relative">
<!-- Ambient Background Elements -->
<div class="absolute inset-0 pointer-events-none">
<div class="absolute top-[-10%] left-[-5%] w-[40%] h-[40%] bg-surface-herbal/20 rounded-full blur-[100px] animate-breath"></div>
<div class="absolute bottom-[-5%] right-[-5%] w-[30%] h-[30%] bg-secondary-container/10 rounded-full blur-[80px] animate-breath" style="animation-delay: 2s;"></div>
</div>
<!-- Login Container -->
<main class="w-full max-w-[420px] px-margin-mobile relative z-10 flex flex-col items-center">
<!-- Identity Header -->
<header class="mb-xl flex flex-col items-center">
<div class="bg-surface-mint p-md rounded-xl mb-md soft-elevation">
<span class="material-symbols-outlined text-primary text-[32px]" style="font-variation-settings: &quot;FILL&quot; 1;">bubble_chart</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">Praana</h1>
<p class="font-label-md text-label-md text-on-surface-variant mt-xs">Return to your center.</p>
</header>
<!-- Form Card -->
<section class="bg-surface-mint w-full p-xl rounded-xl soft-elevation flex flex-col gap-lg border border-border-dusty/30">
<form action="#" class="flex flex-col gap-md">
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant px-sm" for="email">Email Address</label>
<div class="relative">
<input class="w-full bg-surface/50 border border-border-dusty rounded-xl px-md py-md font-body-md text-body-md text-on-surface focus:ring-0 focus:border-primary-container input-focus-transition placeholder:text-outline/50" id="email" placeholder="name@example.com" type="email">
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-outline/40">mail</span>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center px-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-secondary hover:text-primary transition-colors" href="#">Forgot?</a>
</div>
<div class="relative">
<input class="w-full bg-surface/50 border border-border-dusty rounded-xl px-md py-md font-body-md text-body-md text-on-surface focus:ring-0 focus:border-primary-container input-focus-transition placeholder:text-outline/50" id="password" placeholder="••••••••" type="password">
<button class="absolute right-md top-1/2 -translate-y-1/2 text-outline/40 hover:text-on-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Action Button -->
<button class="mt-sm bg-primary text-surface-mint font-title-lg text-title-lg py-md rounded-xl hover:bg-primary-container transition-all active:scale-[0.98] soft-elevation" type="submit">
                    Enter Space
                </button>
</form>
<div class="relative py-xs flex items-center">
<div class="flex-grow border-t border-border-dusty/30"></div>
<span class="flex-shrink mx-md font-label-sm text-label-sm text-outline/50">or continue with</span>
<div class="flex-grow border-t border-border-dusty/30"></div>
</div>
<!-- Ritual Entry (Biometric/Key) -->
<button class="w-full flex items-center justify-center gap-sm bg-surface-container-low border border-border-dusty/20 py-md rounded-xl font-label-md text-label-md text-on-surface hover:bg-surface-container-high transition-colors active:scale-[0.98]"><svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path></svg> Continue with Google</button>
</section>
<!-- Footer Navigation -->
<footer class="mt-xl text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                New to the breath? 
                <a class="text-primary font-semibold hover:underline decoration-surface-herbal decoration-2 underline-offset-4 ml-xs" href="#">Create an Account</a>
</p>
</footer>
</main>
<!-- Decorative Illustration -->
<div class="mt-xl opacity-30 select-none pointer-events-none md:fixed md:bottom-12 md:right-12 md:mt-0 md:opacity-20">
<div class="flex flex-col items-center">
<div class="w-24 h-24 rounded-full bg-gradient-to-tr from-surface-herbal to-secondary-container blur-xl animate-breath"></div>
<p class="font-label-sm text-label-sm tracking-widest text-secondary mt-sm uppercase opacity-40">Presence through focus</p>
</div>
</div>
<script>
        // Simple micro-interaction for input fields
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.classList.add('scale-[1.01]');
                input.parentElement.parentElement.style.transition = 'transform 0.3s ease';
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.classList.remove('scale-[1.01]');
            });
        });

        // Form Submission Simulation
        document.querySelector('form').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
            btn.classList.add('opacity-80');
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.classList.remove('opacity-80');
                // Logic for successful entry would go here
            }, 1500);
        });
    </script>


</body></html>
